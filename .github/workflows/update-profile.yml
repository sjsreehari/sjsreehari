name: Update profile sections

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: sjsreehari
        run: |
          gh api -X GET search/issues \
            -f q="is:pr is:merged author:${USER_NAME} is:public -user:${USER_NAME}" \
            -f sort=updated -f order=desc -f per_page=8 \
            --jq '.items[] | "| [\(.title)](\(.html_url)) | \(.repository_url | sub("https://api.github.com/repos/";"")) | \(.pull_request.merged_at[:10]) |"' \
            > prs.txt

      - name: Update README
        run: |
          python3 - <<'PY'
          import re
          def table(head, sep, path, empty):
              rows = open(path).read().strip()
              return head + "\n" + sep + "\n" + (rows if rows else empty)
          s = open("README.md").read()
          prs = table("| Pull request | Repository | Merged |", "| --- | --- | --- |",
                      "prs.txt", "| _No merged PRs yet_ | | |")
          s = re.sub(r"<!-- PRS:START -->.*?<!-- PRS:END -->",
                     f"<!-- PRS:START -->\n{prs}\n<!-- PRS:END -->", s, flags=re.S)
          open("README.md", "w").write(s)
          PY
          rm prs.txt

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update profile sections"
          git push
